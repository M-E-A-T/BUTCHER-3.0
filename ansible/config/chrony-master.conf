# Clock master for the meat laptops: this Mac serves its own clock over NTP.
# Installed by ansible/clockSync.yml as /opt/homebrew/etc/chrony-master.conf and
# run with -x, so chronyd never adjusts the Mac's clock (macOS keeps doing
# that); it only hands its time out to the laptops.
# (chrony has no end-of-line comments: keep every comment on its own line.)

# Serve time even with no upstream source.
local stratum 8
# The laptop network.
allow 10.10.10.0/24
# No chronyc control socket needed.
cmdport 0
pidfile /var/run/meat-chronyd.pid
